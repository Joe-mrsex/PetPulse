name: petpulse
description: "PetPulse - Adopción responsable con trazabilidad real"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- Firebase (backend en la nube) ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  # --- Almacenamiento de archivos (Cloudinary, plan gratuito sin tarjeta) ---
  http: ^1.2.2

  # --- Selección de imágenes / archivos ---
  image_picker: ^1.1.2
  file_picker: ^12.2.0
  cross_file: ^0.3.4+2

  # --- Utilidades ---
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
