
name: Build PetPulse APK

on:
  workflow_dispatch:      # Permite ejecutarlo manualmente desde la pestaña Actions
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar el código (opcional, no detiene el build)
        run: flutter analyze || true

      - name: Compilar APK de release
        run: flutter build apk --release

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: petpulse-apk
          path: build/app/outputs/flutter-apk/app-release.apk
